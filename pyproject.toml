[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuku-promo-finder"
version = "1.0.0"
description = "A screenplay-to-promo recommendation pipeline for Kuku's AI Generalist assignment"
requires-python = ">=3.10"
dependencies = ["openai>=1.55.0"]

[project.scripts]
kuku-promo-finder = "kukupromo.cli:main"

[tool.setuptools.packages.find]
include = ["kukupromo*"]
